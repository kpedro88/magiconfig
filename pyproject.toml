[build-system]
requires = ["flit_core >=3.11,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "magiconfig"
authors = [{name = "Kevin Pedro", email = "kpedro88@gmail.com"}]
dynamic = ["version", "description"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3.9",
    "Operating System :: OS Independent",
]
keywords = ["config", "configuration", "argparse", "parameters", "magiconfig"]
dependencies = []

[project.urls]
Homepage = "https://github.com/kpedro88/magiconfig"

[tool.flit.module]
name = "magiconfig"

[tool.flit.sdist]
include = ["README.md", "LICENSE", "examples/*.py"]
exclude = ["tests/",".gitignore"]
